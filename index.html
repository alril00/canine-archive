<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинологический архив — Мультимедиа-библиотека пород собак</title>
    <style>
        :root {
            --primary: #1e3a5f;
            --primary-dark: #142842;
            --primary-tint: #f0f4f8;
            --accent: #8c3b2b;
            --bg: #f3f1ed;
            --surface: #ffffff;
            --text: #1f2428;
            --text-muted: #586069;
            --border: #d1d5db;
            --border-strong: #9ca3af;
            --link: #1b4f91;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        /* Верхняя панель навигации */

        header {
            background: var(--primary);
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .header-inner {
            max-width: 1220px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 12px;
            cursor: pointer;
            color: #ffffff;
            text-decoration: none;
        }

        .logo-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            letter-spacing: 0.3px;
            font-weight: bold;
        }

        .logo-sub {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            padding-left: 10px;
        }

        nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        nav a {
            color: rgba(255, 255, 255, 0.88);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        nav a:hover,
        nav a.active {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }

        /* Поиск */

        .search-box {
            position: relative;
            width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-size: 0.88rem;
            background: rgba(255, 255, 255, 0.95);
            color: var(--text);
        }

        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 0 0 6px 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
            max-height: 340px;
            overflow-y: auto;
            display: none;
            z-index: 200;
            color: var(--text);
        }

        .search-item {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.88rem;
        }

        .search-item:hover {
            background: var(--primary-tint);
        }

        .search-item small {
            color: var(--text-muted);
            display: block;
            font-size: 0.75rem;
        }

        /* Основной макет */

        .container {
            max-width: 1220px;
            margin: 22px auto;
            padding: 0 24px 60px;
        }

        /* Хлебные крошки */

        .breadcrumbs {
            background: var(--surface);
            padding: 10px 18px;
            border-radius: 4px;
            border: 1px solid var(--border);
            margin-bottom: 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .breadcrumbs a {
            color: var(--link);
            text-decoration: none;
            cursor: pointer;
        }

        .breadcrumbs a:hover {
            text-decoration: underline;
        }

        .breadcrumbs span.sep {
            color: #9ca3af;
        }

        /* Лист статьи */

        .article-sheet {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 32px 38px;
            box-shadow: var(--shadow);
        }

        .article-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1.article-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.05rem;
            font-weight: normal;
            color: #111827;
            line-height: 1.25;
        }

        .article-category-badge {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            background: var(--primary-tint);
            color: var(--primary);
            padding: 4px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            font-weight: 600;
        }

        h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.4rem;
            font-weight: normal;
            color: var(--primary-dark);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin: 28px 0 14px;
        }

        h3 {
            font-size: 1.08rem;
            margin: 18px 0 8px;
            color: #1f2937;
        }

        p {
            margin-bottom: 14px;
        }

        ul,
        ol {
            margin: 0 0 16px 22px;
        }

        li {
            margin-bottom: 6px;
        }

        /* Гипертекстовые ссылки внутри статей */

        .hyper-link {
            color: var(--link);
            text-decoration: none;
            border-bottom: 1px solid rgba(27, 79, 145, 0.35);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            padding: 0 1px;
        }

        .hyper-link:hover {
            background: var(--primary-tint);
            border-bottom-color: var(--link);
        }

        .hyper-link.term-ref {
            color: var(--accent);
            border-bottom: 1px dashed rgba(140, 59, 43, 0.45);
        }

        .hyper-link.term-ref:hover {
            background: #fdf2f0;
            border-bottom-color: var(--accent);
        }

        /* Карточка-сводка породы (справа) */

        .spec-card {
            float: right;
            width: 330px;
            margin: 0 0 22px 28px;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px;
            font-size: 0.88rem;
        }

        .spec-card-header {
            background: var(--primary);
            color: white;
            text-align: center;
            font-family: Georgia, serif;
            padding: 9px;
            margin: -14px -14px 12px -14px;
            font-size: 1.05rem;
            border-radius: 3px 3px 0 0;
        }

        .spec-img-wrap {
            margin-bottom: 12px;
        }

        .spec-img-wrap img {
            width: 100%;
            height: 215px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid var(--border);
            display: block;
        }

        .gallery-thumbs {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .gallery-thumbs img {
            width: 58px;
            height: 42px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 2px;
            opacity: 0.65;
        }

        .gallery-thumbs img.active,
        .gallery-thumbs img:hover {
            border-color: var(--primary);
            opacity: 1;
        }

        .spec-card table {
            width: 100%;
            border-collapse: collapse;
        }

        .spec-card th,
        .spec-card td {
            padding: 7px 4px;
            border-top: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: top;
        }

        .spec-card th {
            width: 44%;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Шкалы поведения */

        .traits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 16px 0 24px;
            background: #f8fafc;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .trait-item label {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
        }

        /* Мультимедиа секция */

        .media-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 14px;
            background: #f8fafc;
            padding: 18px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .media-card {
            background: white;
            padding: 14px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .media-card h4 {
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .video-placeholder {
            background: #111827;
            color: #f9fafb;
            padding: 14px;
            border-radius: 3px;
            font-size: 0.84rem;
            margin-top: 8px;
        }

        .video-placeholder code {
            display: block;
            margin-top: 6px;
            color: #93c5fd;
            font-size: 0.78rem;
            word-break: break-all;
        }

        /* Сетки карточек */

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.18s, box-shadow 0.18s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            height: 185px;
            object-fit: cover;
        }

        .card-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-family: Georgia, serif;
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Фильтры */

        .filter-panel {
            background: var(--primary-tint);
            padding: 18px;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 22px;
            border: 1px solid #cbd5e1;
        }

        .filter-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary-dark);
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-strong);
            border-radius: 3px;
            background: white;
            font-size: 0.9rem;
        }

        /* Таблицы */

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.9rem;
        }

        .data-table th,
        .data-table td {
            border: 1px solid var(--border);
            padding: 9px 12px;
            text-align: left;
        }

        .data-table th {
            background: var(--primary-tint);
            color: var(--primary-dark);
            font-weight: 600;
        }

        /* Нижний блок: Примечания и упоминания в статье */

        .references-footer {
            margin-top: 38px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
            background: #fafafa;
            padding: 20px 24px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .references-footer h3 {
            font-family: Georgia, serif;
            font-size: 1.15rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--primary-dark);
        }

        .ref-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            font-size: 0.88rem;
        }

        .ref-list {
            margin-left: 18px;
            margin-bottom: 0;
        }

        .ref-list li {
            margin-bottom: 5px;
        }

        /* Всплывающая подсказка */

        #preview-tooltip {
            position: fixed;
            max-width: 310px;
            background: white;
            border: 1px solid var(--border-strong);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
            padding: 11px 14px;
            border-radius: 4px;
            font-size: 0.84rem;
            z-index: 999;
            pointer-events: none;
            display: none;
            line-height: 1.45;
        }

        #preview-tooltip strong {
            display: block;
            color: var(--primary);
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 8px 14px;
            border-radius: 3px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.86rem;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .callout-box {
            border-left: 4px solid var(--accent);
            background: #fdf8f6;
            padding: 14px 18px;
            margin: 18px 0;
            font-size: 0.94rem;
        }

        @media (max-width: 768px) {
            .spec-card {
                float: none;
                width: 100%;
                margin: 0 0 20px 0;
            }

            .media-box,
            .ref-columns {
                grid-template-columns: 1fr;
            }

            .search-box {
                width: 100%;
            }

            .article-sheet {
                padding: 20px;
            }

            .stats-bar {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 14px;
                background: var(--primary-tint);
                border: 1px solid #cbd5e1;
                border-radius: 4px;
                padding: 16px 20px;
                margin: 18px 0 24px;
            }

            .stat-box strong {
                display: block;
                font-family: Georgia, serif;
                font-size: 1.65rem;
                color: var(--primary);
                line-height: 1.2;
            }

            .stat-box span {
                font-size: 0.82rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }

            /* Блок "Избранный материал" на главной */
            .featured-banner {
                display: grid;
                grid-template-columns: 1.4fr 1fr;
                gap: 20px;
                background: #fafaf9;
                border: 1px solid var(--border);
                border-left: 4px solid var(--primary);
                padding: 20px 24px;
                border-radius: 4px;
                margin-bottom: 26px;
            }

            .featured-label {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                color: var(--accent);
                font-weight: 700;
                margin-bottom: 6px;
            }

            /* Форма создания статьи */
            .editor-form {
                display: flex;
                flex-direction: column;
                gap: 14px;
                max-width: 760px;
                margin-top: 16px;
            }

            .editor-form label {
                display: block;
                font-weight: 600;
                font-size: 0.9rem;
                margin-bottom: 4px;
            }

            .editor-form input,
            .editor-form select,
            .editor-form textarea {
                width: 100%;
                padding: 9px 12px;
                border: 1px solid var(--border-strong);
                border-radius: 4px;
                font-family: inherit;
                font-size: 0.92rem;
            }

            .editor-form textarea {
                min-height: 160px;
                line-height: 1.6;
            }

            .link-helper-chips {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-top: 6px;
            }

            .chip-btn {
                background: var(--primary-tint);
                border: 1px solid #cbd5e1;
                color: var(--primary-dark);
                font-size: 0.78rem;
                padding: 3px 8px;
                border-radius: 3px;
                cursor: pointer;
            }

            .chip-btn:hover {
                background: #dce6f2;
            }

            .btn-accent {
                background: var(--accent);
                font-weight: 600;
                padding: 10px 18px;
                font-size: 0.92rem;
                box-shadow: 0 2px 6px rgba(140, 59, 43, 0.25);
            }

            .btn-accent:hover {
                background: #732f22;
            }

        }
    </style>
</head>

<body>

    <header>

        <div class="header-inner">
            <a class="logo" onclick="navigate('home')">
                <span class="logo-title">Кинологический архив</span>
                <span class="logo-sub">Мультимедиа-библиотека</span>
            </a>
            <nav id="main-nav">
                <a onclick="navigate('home')" data-route="home">Главная</a>
                <a onclick="navigate('catalog')" data-route="catalog">Каталог пород</a>
                <a onclick="navigate('glossary')" data-route="glossary">Статьи</a>
                <!-- <a onclick="openRandomArticle()">Случайная статья</a> -->
                <a onclick="navigate('create')" data-route="create">Добавить статью</a>

            </nav>
            <div class="search-box">
                <input type="text" id="global-search" placeholder="Поиск по библиотеке..." autocomplete="off">
                <div class="search-results-dropdown" id="search-dropdown"></div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <main class="article-sheet clearfix" id="app-content"></main>
    </div>

    <div id="preview-tooltip"></div>

    <script>
        /**
         * ============================================================================
         * БАЗА ДАННЫХ МУЛЬТИМЕДИА-БИБЛИОТЕКИ
         * Формат внутренних гиперссылок: [[type:id|Отображаемый текст]]
         * Типы: group (группы), breed (породы), term (термины и тематические статьи)
         * ============================================================================
         */
        const DB = {
            groups: {
                poodles: {
                    id: "poodles",
                    name: "Пудели",
                    originCountry: "Франция / Германия",
                    image: "img/группа-пудель.png",
                    shortDesc: "Группа водяных и декоративных собак, отличающихся выдающимся интеллектом и кудрявой шерстью без подшерстка.",
                    notes: [
                        "Стандарт FCI № 172 (Пудель / Caniche), секция 2 (Пудели).",
                        "Исследование С. Корена «The Intelligence of Dogs» (1994), раздел рабочих и служебных качеств."
                    ],
                    content: `
                <p><strong>Пудели</strong> — группа пород собак, исторически сформировавшаяся в Западной Европе (преимущественно во [[term:breeding-countries|Франции и Германии]]) как подружейные водяные ретриверы для подачи дичи с воды. Сегодня они признаны одними из самых обучаемых компаньонов в мире.</p>
                <p>Согласно [[term:coren-rating|рейтингу интеллекта собак Стэнли Корена]], пудель занимает <strong>второе место</strong> среди всех изученных пород, уступая лишь [[breed:border-collie|бордер-колли]]. Благодаря сочетанию высокой обучаемости и атлетизма представители этой группы регулярно побеждают в соревнованиях по [[term:agility|аджилити]] и обидиенс.</p>
                <h2>Разновидности внутри группы</h2>
                <p>Международная кинологическая федерация (FCI) и [[term:akc|Американский клуб собаководства]] разделяют пуделей по росту в холке. В библиотеке представлены следующие разновидности:</p>
                <ul>
                    <li>[[breed:poodle-toy|Той-пудель]] — самая миниатюрная разновидность (до 28 см в холке), выведенная в начале XX века.</li>
                    <li>[[breed:poodle-mini|Малый (миниатюрный) пудель]] — универсальная собака среднего размера (35–45 см), популярная в спорте и цирковом искусстве.</li>
                    <li>[[breed:poodle-standard|Большой (королевский) пудель]] — крупная, статная собака (45–60 см), сохранившая рабочие качества водяного ретривера.</li>
                </ul>
                <h2>Особенности шерстного покрова</h2>
                <p>Все пудели обладают густой вьющейся шерстью без [[term:undercoat|подшерстка]]. Они практически не подвержены сезонной [[term:hypoallergenic|линьке]], однако требуют регулярного профессионального груминга каждые 4–6 недель.</p>
            `
                },
                retrievers: {
                    id: "retrievers",
                    name: "Ретриверы",
                    originCountry: "Великобритания / Канада",
                    image: "img/группа-ретриверы.png",

                <p>Для составления рейтинга Корен опросил более 200 судей по рабочим качествам из [[term:akc|Американского клуба собаководства (AKC)]] и Канадского клуба собаководства. Оценивался <strong>интеллект послушания и адаптивности</strong> — сколько повторений требуется собаке для запоминания новой команды.</p>
                <p>Лидерами мирового рейтинга признаны [[breed:border-collie|бордер-колли]] (1-е место), [[group:poodles|пудель]] (2-е место) и [[breed:german-shepherd|немецкая овчарка]] (3-е место). При этом охотничьи породы (такие как [[breed:beagle|бигль]] или [[breed:dachshund|такса]]) занимают более низкие строчки из-за склонности к самостоятельной работе по следу, а не из-за дефицита когнитивных способностей.</p>

        // Загрузка пользовательских статей из localStorage (если пользователь уже создавал их ранее)
        function loadCustomArticles() {
            const saved = localStorage.getItem('kinopedia_custom_terms');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    Object.assign(DB.terms, parsed);
                } catch (e) {
                    console.error("Ошибка чтения сохраненных статей:", e);
                }
            }
        }
        loadCustomArticles();
        /**
         * ============================================================================
         * ПАРСЕР ГИПЕРССЫЛОК И АВТОМАТИЧЕСКИЙ СБОР УПОМИНАНИЙ В СТАТЬЕ
         * ============================================================================
         */
        function parseLinksAndCollectRefs(rawHtmlBlocks) {
            const collected = new Map(); // key: "type:id", value: { type, id, title }

            const parsedBlocks = rawHtmlBlocks.map(block => {
                if (!block) return '';
                return block.replace(/\[\[(group|breed|term):([a-z0-9-]+)\|([^\]]+)\]\]/g, (match, type, id, label) => {
                    // Сохраняем в коллекцию упоминаний для нижнего блока
                    const key = `${type}:${id}`;
                    if (!collected.has(key)) {
                        let targetTitle = label;
                        if (type === 'group' && DB.groups[id]) targetTitle = DB.groups[id].name;
                        if (type === 'breed' && DB.breeds[id]) targetTitle = DB.breeds[id].name;
                        if (type === 'term' && DB.terms[id]) targetTitle = DB.terms[id].title;
                        collected.set(key, {
                            type,
                            id,
                            title: targetTitle
                        });
                    }

                    const extraClass = type === 'term' ? 'term-ref' : '';
                    return `<a class="hyper-link ${extraClass}" 
                       onclick="navigate('${type}', '${id}')"
                       onmouseenter="showTooltip(event, '${type}', '${id}')"
                       onmouseleave="hideTooltip()">${label}</a>`;
                });
            });

            return {
                parsedBlocks,
                references: Array.from(collected.values())
            };
        }

        function renderReferencesFooter(references, notes = []) {
            if (references.length === 0 && (!notes || notes.length === 0)) return '';

            const typeLabels = {
                group: 'Группа пород',
                breed: 'Порода',
                term: 'Статья / Термин'
            };

            const linksHtml = references.length > 0 ?
                `<ul class="ref-list">
            ${references.map(ref => `
                <li>
                    <a class="hyper-link" onclick="navigate('${ref.type}', '${ref.id}')">${ref.title}</a>
                    <span style="color:#6b7280; font-size:0.8rem;">(${typeLabels[ref.type]})</span>
                </li>
            `).join('')}
           </ul>`
                : `<p style="color:#6b7280; font-size:0.86rem;">В тексте данной статьи нет внутренних переходов.</p>`;

            const notesHtml = (notes && notes.length > 0)
                ? `<ol class="ref-list">
            ${notes.map(n => `<li>${n}</li>`).join('')}
           </ol>`
                : `<p style="color:#6b7280; font-size:0.86rem;">Архивные данные кинологической библиотеки.</p>`;

            return `
        <section class="references-footer">
            <div class="ref-columns">
                <div>
                    <h3>Упоминаемые статьи и породы</h3>
                    ${linksHtml}
                </div>
                <div>
                    <h3>Примечания и источники</h3>
                    ${notesHtml}
                </div>
            </div>
        </section>
    `;
        }

        /**
         * ============================================================================
         * МАРШРУТИЗАЦИЯ И ХЛЕБНЫЕ КРОШКИ
         * ============================================================================
         */
        function navigate(view, id = null) {
            hideTooltip();
            const hash = id ? `#/${view}/${id}` : `#/${view}`;
            if (window.location.hash === hash) {
                renderRoute();
            } else {
                window.location.hash = hash;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('hashchange', renderRoute);

        function renderRoute() {
            const hash = window.location.hash.replace('#/', '');
            const parts = hash.split('/');
            const view = parts[0] || 'home';
            const id = parts[1] || null;

            document.querySelectorAll('#main-nav a').forEach(a => {
                const isCountries = view === 'term' && id === 'breeding-countries' && a.dataset.route === 'countries';
                a.classList.toggle('active', a.dataset.route === view || isCountries);
            });

            if (view === 'home') renderHome();
            else if (view === 'catalog') renderCatalog();
            else if (view === 'glossary') renderGlossary();
            else if (view === 'create') renderCreateArticle();
            else if (view === 'group' && DB.groups[id]) renderGroup(id);
            else if (view === 'breed' && DB.breeds[id]) renderBreed(id);
            else if (view === 'term' && DB.terms[id]) renderTerm(id);
            else renderHome();
        }

        function setBreadcrumbs(items) {
            const container = document.getElementById('breadcrumbs');
            container.innerHTML = items.map((item, idx) => {
                if (idx === items.length - 1) return `<span>${item.label}</span>`;
                return `<a onclick="${item.action}">${item.label}</a> <span class="sep">/</span>`;
            }).join(' ');
        }

        /**
         * ============================================================================
         * РЕНДЕР СТРАНИЦ
         * ============================================================================
         */
        function renderHome() {
            setBreadcrumbs([{ label: 'Главная страница библиотеки' }]);

            // Подсчет общего количества материалов в фонде
            const groupsCount = Object.keys(DB.groups).length;
            const breedsCount = Object.keys(DB.breeds).length;
            const termsCount = Object.keys(DB.terms).length;
            const totalArticles = groupsCount + breedsCount + termsCount;

            const groupsHtml = Object.values(DB.groups).map(g => {
                const count = Object.values(DB.breeds).filter(b => b.groupId === g.id).length;
                return `

                    <div class="card-title">${g.name}</div>
                    <div class="card-meta">Пород в разделе: ${count}</div>
                    <p style="font-size:0.88rem; color:#374151; margin:0;">${g.shortDesc}</p>
                </div>

        `;
            }).join('');

            const recentArticles = Object.values(DB.terms).slice(-4).reverse().map(t => `

            <div class="card-meta">${t.category}</div>
            <div class="card-title" style="font-size:1.08rem;">${t.title}</div>
            <p style="font-size:0.88rem; margin:0; color:#374151;">${t.shortDesc}</p>
        </div>
    `).join('');

            document.getElementById('app-content').innerHTML = `
       
           <div class="article-header">
            <h1 class="article-title">Мультимедиа-библиотека пород собак</h1>
            <button class="btn btn-accent" onclick="navigate('create')">Создать новую статью</button>
        </div>
        </div>
        <p>Систематизированный справочник по кинологии, истории селекции, анатомии и поведению собак. Все материалы связаны перекрестными гипертекстовыми ссылками.</p>

        <!-- Счетчик фонда библиотеки -->
        <div class="stats-bar">
            <div class="stat-box">
                <strong>${totalArticles}</strong>
                <span>Материалов в фонде</span>
            </div>
            <div class="stat-box">
                <strong>${breedsCount}</strong>
                <span>Страниц пород</span>
            </div>
            <div class="stat-box">
                <strong>${groupsCount}</strong>
                <span>Кинологических групп</span>
            </div>
            <div class="stat-box">
                <strong>${termsCount}</strong>
                <span>Статей и терминов</span>
            </div>
        </div>

       

        <h2>Классификация по группам пород</h2>
        <div class="cards-grid">${groupsHtml}</div>

        <h2>Статьи и термины справочника</h2>
        <div class="cards-grid">${recentArticles}</div>
    `;
        }

        // Страница создания новой статьи пользователем
        function renderCreateArticle() {
            setBreadcrumbs([
                { label: 'Главная', action: "navigate('home')" },
                { label: 'Добавление новой статьи' }
            ]);

            // Кнопки быстрой вставки гиперссылок на существующие породы
            const breedChips = Object.values(DB.breeds).map(b =>
                `<button type="button" class="chip-btn" onclick="insertWikiTag('breed', '${b.id}', '${b.name}')">${b.name}</button>`
            ).join('');

            document.getElementById('app-content').innerHTML = `
        <div class="article-header">
            <h1 class="article-title">Создание новой статьи в библиотеке</h1>
            <span class="article-category-badge">Редактор фонда</span>
        </div>
        <p>Добавленный материал сохранится в локальном хранилище браузера, автоматически получит собственную страницу, попадет в алфавитный указатель и увеличит общий счетчик статей.</p>

        <form class="editor-form" onsubmit="saveNewArticle(event)">
            <div>
                <label>Заголовок статьи или термина *</label>

                <label>Раздел / Категория *</label>

                <div style="font-size:0.8rem; color:#586069; margin-top:4px;">Быстрая вставка гиперссылки на породу в текст:</div>

        // Вставка тега [[breed:id|Название]] в поле текста при нажатии на кнопку-подсказку
        function insertWikiTag(type, id, label) {
            const textarea = document.getElementById('new-art-content');
            const tag = `[[${type}:${id}|${label}]]`;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + tag + textarea.value.substring(end);
            textarea.focus();
        }

        // Сохранение новой статьи в DB и localStorage
        function saveNewArticle(e) {
            e.preventDefault();
            const title = document.getElementById('new-art-title').value.trim();
            const category = document.getElementById('new-art-category').value;
            const shortDesc = document.getElementById('new-art-desc').value.trim();
            const rawText = document.getElementById('new-art-content').value.trim();
            const note = document.getElementById('new-art-note').value.trim();

            // Превращаем абзацы текста в теги <p>
            const formattedContent = rawText.split('\n')
                .filter(line => line.trim() !== '')
                .map(line => `<p>${line.trim()}</p>`)
                .join('');

            const newId = 'custom-' + Date.now();
            const newArticle = {
                id: newId,
                title: title,
                category: category,
                shortDesc: shortDesc,
                autoWidget: null,
                notes: note ? [note] : ["Пользовательский материал, добавленный через редактор библиотеки."],
                content: formattedContent
            };

            // Добавляем в оперативную базу и сохраняем в localStorage
            DB.terms[newId] = newArticle;

            const existingCustom = JSON.parse(localStorage.getItem('kinopedia_custom_terms') || '{}');
            existingCustom[newId] = newArticle;
            localStorage.setItem('kinopedia_custom_terms', JSON.stringify(existingCustom));

            // Сразу открываем созданную статью
            navigate('term', newId);
        }

        function renderGroup(groupId) {
            const group = DB.groups[groupId];
            setBreadcrumbs([
                { label: 'Главная', action: "navigate('home')" },
                { label: 'Каталог пород', action: "navigate('catalog')" },
                { label: group.name }
            ]);

            const { parsedBlocks, references } = parseLinksAndCollectRefs([group.content]);
            const groupBreeds = Object.values(DB.breeds).filter(b => b.groupId === groupId);

            const breedsCards = groupBreeds.map(b => `
        <div class="card" onclick="navigate('breed', '${b.id}')">
            <img src="${b.images[0]}" alt="${b.name}">
            <div class="card-body">

        function renderCatalog() {
            setBreadcrumbs([
                { label: 'Главная', action: "navigate('home')" },
                { label: 'Каталог пород и фильтрация' }
            ]);

            document.getElementById('app-content').innerHTML = `

            <span class="article-category-badge">Поиск и фильтрация</span>
        </div>
        <div class="filter-panel">
            <div class="filter-group">
                <label>Поиск по названию:</label>

                <label>Группа пород:</label>
                <select id="filter-group" onchange="applyFilters()">

                    ${Object.values(DB.groups).map(g => `<option value="${g.id}">${g.name}</option>`).join('')}

            </div>
            <div class="filter-group">
                <label>Интенсивность линьки:</label>
                <select id="filter-shedding" onchange="applyFilters()">
                    <option value="all">Любая</option>
                    <option value="low">Минимальная и низкая (1–2/5)</option>
                    <option value="high">Средняя и высокая (3–5/5)</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Минимальный интеллект:</label>
                <select id="filter-intel" onchange="applyFilters()">
                    <option value="1">От 1 балла и выше</option>
                    <option value="4">От 4 баллов и выше</option>
                    <option value="5">Только 5 из 5</option>
                </select>
            </div>
        </div>

    `;

            applyFilters();

        function applyFilters() {
            const nameQ = document.getElementById('filter-name').value.toLowerCase();
            const groupQ = document.getElementById('filter-group').value;
            const shedQ = document.getElementById('filter-shedding').value;
            const intelQ = parseInt(document.getElementById('filter-intel').value, 10);

            // 1. Фильтруем и сразу сортируем породы по русскому алфавиту
            const filtered = Object.values(DB.breeds)
                .filter(b => {
                    const matchName = b.name.toLowerCase().includes(nameQ);
                    const matchGroup = groupQ === 'all' || b.groupId === groupQ;
                    const matchShed = shedQ === 'all' || (shedQ === 'low' ? b.sheddingLevel <= 2 : b.sheddingLevel >= 3);
                    const matchIntel = b.traits.intelligence >= intelQ;
                    return matchName && matchGroup && matchShed && matchIntel;
                })
                .sort((a, b) => a.name.localeCompare(b.name, 'ru'));

            const container = document.getElementById('catalog-results');
            if (filtered.length === 0) {
                container.innerHTML = `<p>По заданным параметрам породы не найдены.</p>`;
                return;
            }

            // 2. Группируем отсортированные породы по первой букве алфавита
            const groupedByLetter = {};
            filtered.forEach(b => {
                const letter = b.name[0].toUpperCase();
                if (!groupedByLetter[letter]) groupedByLetter[letter] = [];
                groupedByLetter[letter].push(b);
            });

            // 3. Отрисовываем секции с буквами (А, Б, Г, З, Л...) и карточками внутри
            container.style.display = 'block'; // отключаем общую сетку, так как сетки теперь внутри каждой буквы
            container.innerHTML = Object.keys(groupedByLetter).map(letter => `
        <h2 style="margin-top: 24px;">${letter}</h2>
        <div class="cards-grid">
            ${groupedByLetter[letter].map(b => `
                <div class="card" onclick="navigate('breed', '${b.id}')">
                    <img src="${b.images[0]}" alt="${b.name}">
                    <div class="card-body">
                        <div class="card-title">${b.name}</div>
                        <div class="card-meta">${DB.groups[b.groupId].name}</div>
                        <p style="font-size:0.86rem; margin:0;">Интеллект: ${b.traits.intelligence}/5 • Энергия: ${b.traits.energy}/5 • Линька: ${b.sheddingLevel}/5</p>
                    </div>
                </div>
            `).join('')}
        </div>
    `).join('');
        }
        function renderGlossary() {
            setBreadcrumbs([
                { label: 'Главная', action: "navigate('home')" },
                { label: 'Алфавитный указатель статей и терминов' }
            ]);

            const sortedTerms = Object.values(DB.terms).sort((a, b) => a.title.localeCompare(b.title, 'ru'));
            const grouped = {};
            sortedTerms.forEach(t => {
                const letter = t.title[0].toUpperCase();
                if (!grouped[letter]) grouped[letter] = [];
                grouped[letter].push(t);
            });

            const sectionsHtml = Object.keys(grouped).map(letter => `
        <h2>${letter}</h2>
        <ul>
            ${grouped[letter].map(t => `
                <li style="margin-bottom:8px;">
                    <a class="hyper-link" onclick="navigate('term', '${t.id}')"><strong>${t.title}</strong></a>
                    <span style="color:#4b5563; font-size:0.9rem;"> — ${t.shortDesc}</span>
                </li>
            `).join('')}
        </ul>
    `).join('');

            document.getElementById('app-content').innerHTML = `
        <div class="article-header">
            <h1 class="article-title">Алфавитный указатель статей и терминов</h1>
            <button class="btn" onclick="openRandomArticle()">Открыть случайную статью</button>
        </div>
        <p>Полный перечень кинологических терминов, исторических обзоров и организаций, представленных в библиотеке:</p>
        ${sectionsHtml}
    `;
        }

        /**
         * ============================================================================
         * ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
         * ============================================================================
         */
        function switchGalleryImg(thumbEl, src) {
            document.getElementById('main-breed-photo').src = src;
            document.querySelectorAll('.gallery-thumbs img').forEach(img => img.classList.remove('active'));
            thumbEl.classList.add('active');
        }

        function showTooltip(e, type, id) {
            const tooltip = document.getElementById('preview-tooltip');
            let title = '', desc = '';

            if (type === 'group' && DB.groups[id]) {
                title = 'Группа пород: ' + DB.groups[id].name;
                desc = DB.groups[id].shortDesc;
            } else if (type === 'breed' && DB.breeds[id]) {
                title = 'Порода: ' + DB.breeds[id].name;
                desc = `Происхождение: ${DB.breeds[id].origin}. Рост: ${DB.breeds[id].height}, вес: ${DB.breeds[id].weight}.`;
            } else if (type === 'term' && DB.terms[id]) {
                title = DB.terms[id].title;
                desc = DB.terms[id].shortDesc;
            }

            tooltip.innerHTML = `<strong>${title}</strong><span>${desc}</span>`;
            tooltip.style.display = 'block';
            tooltip.style.left = Math.min(e.clientX + 12, window.innerWidth - 330) + 'px';
            tooltip.style.top = (e.clientY + 16) + 'px';
        }

        function hideTooltip() {
            document.getElementById('preview-tooltip').style.display = 'none';
        }

        const searchInput = document.getElementById('global-search');
        const searchDropdown = document.getElementById('search-dropdown');

        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) {
                searchDropdown.style.display = 'none';
                return;
            }

            const results = [];
            Object.values(DB.groups).forEach(g => {
                if (g.name.toLowerCase().includes(q)) results.push({ type: 'group', id: g.id, title: g.name, sub: 'Группа пород' });
            });
            Object.values(DB.breeds).forEach(b => {
                if (b.name.toLowerCase().includes(q)) results.push({ type: 'breed', id: b.id, title: b.name, sub: 'Порода собаки' });
            });
            Object.values(DB.terms).forEach(t => {
                if (t.title.toLowerCase().includes(q)) results.push({ type: 'term', id: t.id, title: t.title, sub: 'Статья / Термин' });
            });

            if (results.length === 0) {
                searchDropdown.innerHTML = `<div class="search-item">Совпадений не найдено</div>`;
            } else {
                searchDropdown.innerHTML = results.map(r => `
            <div class="search-item" onclick="selectSearchResult('${r.type}', '${r.id}')">
                <strong>${r.title}</strong>
                <small>${r.sub}</small>
            </div>
        `).join('');
            }
            searchDropdown.style.display = 'block';
        });

        function selectSearchResult(type, id) {
            searchInput.value = '';
            searchDropdown.style.display = 'none';
            navigate(type, id);
        }

        function openRandomArticle() {
            const allPages = [
                ...Object.keys(DB.groups).map(id => ['group', id]),
                ...Object.keys(DB.breeds).map(id => ['breed', id]),
                ...Object.keys(DB.terms).map(id => ['term', id])
            ];
            const [type, id] = allPages[Math.floor(Math.random() * allPages.length)];
            navigate(type, id);
        }

        function playSynthesizedBark(breedId) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            const freqMap = {
                "poodle-toy": 750,
                "poodle-mini": 520,
                "poodle-standard": 340,
                "labrador": 280,
                "golden-retriever": 310,
                "border-collie": 440,
                "german-shepherd": 240,
                "beagle": 460,
                "dachshund": 390,
                "amstaff": 320,
                "bull-terrier": 400
            };

            const baseFreq = freqMap[breedId] || 350;
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.55, ctx.currentTime + 0.18);

            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.22);
        }

        renderRoute();
    </script>
